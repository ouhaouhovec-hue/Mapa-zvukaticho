<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mapa ticha</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>
  <script>UPLOADCARE_PUBLIC_KEY = "db5c9d580355e51b2bfe"; UPLOADCARE_LIVE = false;</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Junicode';
      src: url('https://cdn.jsdelivr.net/gh/psb1558/Junicode-font@master/webfonts/Junicode.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Junicode';
      src: url('https://cdn.jsdelivr.net/gh/psb1558/Junicode-font@master/webfonts/Junicode-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
    }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f4fb;
      --surface: #ffffff;
      --surface2: #f0f4fb;
      --border: #dde6f7;
      --accent: #3B86F6;
      --accent2: #1a5fc8;
      --text: #0e1a2e;
      --muted: #6b7fa3;
      --danger: #e53e3e;
      --font-head: 'Junicode', serif;
      --font-body: 'Syne', sans-serif;
      --radius: 12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow: hidden;
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
      
    }


    #header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      padding: clamp(10px, 2vw, 18px) clamp(16px, 3vw, 32px) clamp(14px, 2.5vw, 28px) clamp(12px, 2vw, 24px);
      background: rgba(255,255,255,0.28);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom-right-radius: 24px;
      border: none;
    }

    #header h1 {
      font-family: 'Junicode', serif;
      font-size: clamp(40px, 11vw, 160px);
      font-weight: 700;
      line-height: 0.95;
      color: var(--accent);
      letter-spacing: -0.01em;
      margin-left: -4px;
    }

    #header .sep { display: none; }

    #header .hint {
      font-size: clamp(12px, 1.9vw, 30px);
      color: var(--accent);
      font-family: 'Junicode', serif;
      font-weight: 700;
      font-style: normal;
      letter-spacing: 0.01em;
      opacity: 0.9;
      align-self: flex-end;
      position: relative;
      top: -0.55em;
      padding-right: 0;
    }


    #pin-count {
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 1000;
      width: clamp(180px, 35vw, 340px);
      height: clamp(110px, 22vw, 215px);
      display: flex;
      align-items: flex-end;
      padding: 0 0 clamp(14px, 2.5vw, 28px) clamp(14px, 2.5vw, 28px);
      font-size: clamp(16px, 3vw, 32px);
      font-family: 'Junicode', serif;
      font-weight: 400;
      color: #ffffff;
      line-height: 1.2;
    }


    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(59,134,246,0.12);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }

    #modal-overlay.open { display: flex; }

    #modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 420px;
      max-width: 92vw;
      animation: slideUp 0.2s ease;
      box-shadow: 0 20px 60px rgba(59,134,246,0.15);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #modal h2 {
      font-family: var(--font-head);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--accent);
      font-style: italic;
    }

    #modal h2 .coords {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      display: block;
      margin-top: 4px;
      letter-spacing: 0.04em;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field input[type="text"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .field input[type="text"]:focus {
      border-color: var(--accent);
    }


    #drop-zone {
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }

    #drop-zone:hover, #drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(59,134,246,0.04);
    }

    #drop-zone .dz-file-name {
      font-size: 12px;
      color: var(--accent);
      margin-top: 6px;
      display: none;
    }


    #upload-progress {
      display: none;
      margin-top: 10px;
    }

    #upload-progress .prog-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      letter-spacing: 0.04em;
    }

    #prog-bar-wrap {
      background: var(--surface2);
      border-radius: 999px;
      height: 4px;
      overflow: hidden;
    }

    #prog-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      width: 0%;
      transition: width 0.2s;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 11px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: #0e0e0e;
    }

    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-ghost {
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { color: var(--text); }

    #modal-error {
      font-size: 12px;
      color: var(--danger);
      margin-top: 10px;
      display: none;
    }

   
    .leaflet-popup-content-wrapper {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      box-shadow: 0 8px 32px rgba(59,134,246,0.2) !important;
      padding: 0 !important;
    }

    .leaflet-popup-content {
      margin: 0 !important;
      width: auto !important;
      min-width: 240px !important;
    }

    .leaflet-popup-tip { background: var(--surface) !important; }
    .leaflet-popup-close-button { color: var(--muted) !important; top: 10px !important; right: 10px !important; font-size: 18px !important; }

    .popup-inner {
      padding: 16px;
    }

    .popup-inner h3 {
      font-family: var(--font-head);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--accent);
      padding-right: 20px;
      font-style: italic;
    }

    .popup-inner .popup-coords {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .popup-inner audio {
      width: 100%;
      height: 32px;
      accent-color: var(--accent);
      accent-color: var(--accent);
    }

    .popup-inner .popup-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      font-style: italic;
    }


    .custom-pin {
      width: 14px;
      height: 14px;
      background: var(--accent);
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(59,134,246,0.3);
      transition: transform 0.15s;
    }

    .custom-pin:hover {
      transform: scale(1.4);
    }

    /* Leaflet controls style override */
    .leaflet-control-zoom a {
      background: var(--surface) !important;
      color: var(--accent) !important;
      border-color: var(--border) !important;
      font-weight: 700 !important;
    }

    .leaflet-control-zoom a:hover {
      background: var(--surface2) !important;
    }

    .leaflet-bar {
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      overflow: hidden;
    }

  
    #dot-grid {
      position: fixed;
      bottom: 0;
      right: 0;
      z-index: 1000;
      width: clamp(180px, 30vw, 400px);
      height: clamp(180px, 30vw, 400px);
      pointer-events: none;
    }

    .dot {
      border-radius: 50%;
      background: var(--accent);
    }

 
    #loading {
      position: fixed;
      inset: 0;
      z-index: 3000;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      transition: opacity 0.4s;
    }

    #loading.done { opacity: 0; pointer-events: none; }

    #loading h1 {
      font-family: var(--font-head);
      font-size: 48px;
      font-weight: 900;
      color: var(--accent);
      font-style: italic;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      #header h1 { font-size: clamp(36px, 13vw, 80px); }
      #header .hint { font-size: clamp(11px, 3.5vw, 18px); top: -0.4em; }
      #pin-count { width: clamp(140px, 48vw, 220px); height: clamp(88px, 30vw, 140px); font-size: clamp(12px, 4vw, 20px); padding: 0 0 12px 14px; }
      #dot-grid { width: clamp(130px, 40vw, 220px); height: clamp(130px, 40vw, 220px); }
      #modal { padding: 20px; }
    }

    .leaflet-control-attribution { display: none !important; }
    .leaflet-control-zoom { display: none !important; }
  </style>
</head>
<body>

<div id="loading">
  <h1>Mapa ticha</h1>
  <div class="spinner"></div>
</div>

<div id="map"></div>

<div id="header">
  <h1>Mapa ticha</h1>
  <span class="sep">|</span>
  <span class="hint">Klikni na mapu a přidej své ticho</span>
</div>

<div id="pin-count">
  <img src="blob.png" alt="" style="position:absolute;bottom:0;left:0;width:100%;height:100%;object-fit:fill;pointer-events:none;"/>
  <div style="position:relative;z-index:2;"><span id="count-num"></span> Nahraných tich</div>
</div>

<!-- Add pin modal -->
<div id="modal-overlay">
  <div id="modal">
    <h2>
      Přidat ticho
      <span class="coords" id="modal-coords"></span>
    </h2>

    <div class="field">
      <label>Název</label>
      <input type="text" id="pin-title" placeholder="pocit, název místa, cokoliv"/>
    </div>

    <div class="field">
      <label>Poznámka (nepovinné)</label>
      <input type="text" id="pin-note" placeholder="např. nahráno za úsvitu, šeptání v muzeu..."/>
    </div>

    <div class="field">
      <label>Zvukový soubor</label>
      <div id="drop-zone" style="padding:12px 16px;">
        <input type="hidden" role="uploadcare-uploader" id="uc-file" data-images-only="false"/>
        <div class="dz-file-name" id="file-name" style="margin-top:0"></div>
      </div>
      <div id="upload-progress">
        <div class="prog-label">Nahrávám…</div>
        <div id="prog-bar-wrap"><div id="prog-bar"></div></div>
      </div>
    </div>

    <div id="modal-error"></div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModal()">Zrušit</button>
      <button class="btn btn-primary" id="save-btn" onclick="savePin()">Uložit ticho</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBnVF8MLBPqEMOXZx58yeitE6-v3nWzuYk",
    authDomain: "mapa-8e064.firebaseapp.com",
    projectId: "mapa-8e064",
    storageBucket: "mapa-8e064.firebasestorage.app",
    messagingSenderId: "565194068392",
    appId: "1:565194068392:web:906c8a3032c4e5f1b4cd9d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([49.8, 15.5], 7);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);


  let pendingLat = null;
  let pendingLng = null;
  let selectedFile = null;
  let pinCount = 0;

  function makePinIcon() {
    return L.divIcon({
      className: '',
      html: '<div class="custom-pin"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7],
      popupAnchor: [0, -12]
    });
  }

  function addPinToMap(lat, lng, title, note, audioUrl) {
    const marker = L.marker([lat, lng], { icon: makePinIcon() }).addTo(map);
    const noteHtml = note ? `<div class="popup-note">${note}</div>` : '';
    marker.bindPopup(`
      <div class="popup-inner">
        <h3>${title}</h3>
        <div class="popup-coords">${lat.toFixed(5)}, ${lng.toFixed(5)}</div>
        <audio controls src="${audioUrl}"></audio>
        ${noteHtml}
      </div>
    `);
    pinCount++;
    document.getElementById('count-num').textContent = pinCount;
  }


  async function loadPins() {
    const snap = await getDocs(collection(db, 'pins'));
    snap.forEach(doc => {
      const d = doc.data();
      addPinToMap(d.lat, d.lng, d.title, d.note || '', d.audioUrl);
    });
    document.getElementById('loading').classList.add('done');
  }

  loadPins();


  map.on('click', (e) => {
    pendingLat = e.latlng.lat;
    pendingLng = e.latlng.lng;
    document.getElementById('modal-coords').textContent =
      `${pendingLat.toFixed(5)}, ${pendingLng.toFixed(5)}`;
    document.getElementById('pin-title').value = '';
    document.getElementById('pin-note').value = '';
    document.getElementById('file-name').style.display = 'none';
    document.getElementById('file-name').textContent = '';
    document.getElementById('upload-progress').style.display = 'none';
    document.getElementById('prog-bar').style.width = '0%';
    document.getElementById('modal-error').style.display = 'none';
    document.getElementById('save-btn').disabled = false;
    selectedFile = null;
    ucWidget.value(null);
    document.getElementById('modal-overlay').classList.add('open');
    setTimeout(() => document.getElementById('pin-title').focus(), 100);
  });

  // Uploadcare widget
  const ucWidget = uploadcare.Widget('#uc-file');
  ucWidget.onChange(function(file) {
    if (file) {
      selectedFile = file;
      file.promise().done(function(info) {
        const nameEl = document.getElementById('file-name');
        nameEl.textContent = info.name;
        nameEl.style.display = 'block';
      });
    } else {
      selectedFile = null;
    }
  });

  async function uploadFile(file) {
    return new Promise((resolve, reject) => {
      document.getElementById('prog-bar').style.width = '100%';
      file.promise().done(function(info) {
        resolve(info.cdnUrl);
      }).fail(function() {
        reject(new Error('Upload failed'));
      });
    });
  }

 
  window.closeModal = function() {
    document.getElementById('modal-overlay').classList.remove('open');
  };

  window.savePin = async function() {
    const title = document.getElementById('pin-title').value.trim();
    const note = document.getElementById('pin-note').value.trim();
    const errEl = document.getElementById('modal-error');
    errEl.style.display = 'none';

    if (!title) {
      errEl.textContent = 'Prosím, přidej název.';
      errEl.style.display = 'block';
      return;
    }
    if (!selectedFile) {
      errEl.textContent = 'Prosím, vyber zvukový soubor.';
      errEl.style.display = 'block';
      return;
    }

    const saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Nahrávám…';

    document.getElementById('upload-progress').style.display = 'block';

    try {
      const audioUrl = await uploadFile(selectedFile);

      await addDoc(collection(db, 'pins'), {
        lat: pendingLat,
        lng: pendingLng,
        title,
        note,
        audioUrl,
        createdAt: new Date().toISOString()
      });

      addPinToMap(pendingLat, pendingLng, title, note, audioUrl);
      window.closeModal();
    } catch (err) {
      errEl.textContent = 'Něco se pokazilo: ' + err.message;
      errEl.style.display = 'block';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Uložit ticho';
    }
  };

  // Close modal on overlay click
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal-overlay')) window.closeModal();
  });
</script>

<div id="dot-grid">
  <img src="dots.png" alt="" style="width:100%;height:100%;display:block;"/>
</div>
</body>
